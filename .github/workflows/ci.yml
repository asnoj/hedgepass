name: C++ CI and Sanitizers

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsodium-dev build-essential cmake

      - name: Build with ASan + UBSan
        run: |
          mkdir build
          cd build
          cmake -DSANITIZE=ON ..
          make -j$(nproc)

      - name: Run Unit Tests
        run: |
          cd build
          ./hedgepass_test